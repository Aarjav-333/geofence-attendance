# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geofence
      POSTGRES_PASSWORD: geofence # local development only
      POSTGRES_DB: geofence
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofence"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
